# Sources with execution options (readonly, max_rows) configured per-tool
# Used as a documentation fixture. Integration tests build equivalent config in memory with a live Postgres DSN.

[[sources]]
id = "readonly_limited"
description = "Read-only database for safe queries"
dsn = "postgres://user:pass@localhost:5432/readonly_limited"

[[tools]]
name = "execute_sql"
source = "readonly_limited"
readonly = true
max_rows = 100

[[sources]]
id = "writable_limited"
dsn = "postgres://user:pass@localhost:5432/writable_limited"

[[tools]]
name = "execute_sql"
source = "writable_limited"
readonly = false
max_rows = 500

[[sources]]
id = "writable_unlimited"
dsn = "postgres://user:pass@localhost:5432/writable_unlimited"
